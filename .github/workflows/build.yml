name: Build portable

# Construit l'exécutable portable Windows.
# - À chaque tag « v* » : build + publication sur la Release correspondante.
# - Manuellement (workflow_dispatch) : build + artefact téléchargeable.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer l'exécutable portable
        run: npm run dist

      - name: Publier sur la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe

      - name: Déposer l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: PTN2PDF-portable
          path: release/*.exe
